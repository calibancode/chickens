<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Costco Chicken Counter</title>
<style>
  :root { --bg: #fff8ee; --fg: #2b2118; --accent: #e31837; --muted: #7a6a5a; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; overflow: hidden;
    background: var(--bg); color: var(--fg);
    font-family: system-ui, sans-serif; text-align: center;
  }
  main { position: relative; z-index: 1; padding: 6vh 1rem 0; }
  h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 .5rem; }
  .count {
    font-size: clamp(3rem, 14vw, 9rem); font-weight: 800;
    color: var(--accent); font-variant-numeric: tabular-nums; line-height: 1;
  }
  .today { margin-top: 1.5rem; font-size: 1.1rem; }
  .today span { font-weight: 700; font-variant-numeric: tabular-nums; }
  .meta { margin-top: .5rem; color: var(--muted); font-size: .95rem; }
  canvas { position: fixed; inset: 0; pointer-events: none; }
</style>
</head>
<body>
<main>
  <h1>🍗 Costco rotisserie chickens sold since you opened this page</h1>
  <div class="count" id="count">0</div>
  <div class="today">Sold today so far: <span id="today">0</span></div>
  <div class="meta" id="meta"></div>
</main>
<canvas id="pile"></canvas>
<script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>

<script>
  // Costco FY2025: 157.4M rotisserie chickens sold worldwide.
  const CHICKENS_PER_YEAR = 157_400_000;
  const SECONDS_PER_YEAR = 365 * 24 * 60 * 60;
  const RATE = Math.round(CHICKENS_PER_YEAR / SECONDS_PER_YEAR);

  const countEl = document.getElementById('count');
  const todayEl = document.getElementById('today');
  const fmt = new Intl.NumberFormat();

  document.getElementById('meta').textContent =
    `~${RATE} per second · one every ${Math.round(1000 / RATE)} ms · ` +
    `${fmt.format(CHICKENS_PER_YEAR / 1e6)}M per year (FY2025)`;

  const start = performance.now();
  let shown = 0, last = start;

  const { Engine, Bodies, Body, Composite } = Matter;
  const CW = 44, CH = 24;
  const BELT_SPEED = 20;
  const BELT_H = 14;
  const SPAWN_SKEW = 3;
  const STEP = 1000 / 60;

  const SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 24">
    <g fill="#f3ead8" stroke="#8a6d4b" stroke-width="1">
      <circle cx="37" cy="8" r="3.6"/><circle cx="39" cy="15" r="3.6"/>
      <rect x="22" y="9" width="17" height="5" rx="2" stroke="none"/>
    </g>
    <path d="M2 12 C2 3 13 1 21 5 C25 7 27 10 27 12 C27 15 24 18 20 20 C12 24 2 21 2 12 Z"
          fill="#c8742b" stroke="#7a3e10" stroke-width="1.2"/>
    <path d="M7 9 C10 6 15 5 19 7" fill="none" stroke="#e9a45c" stroke-width="2" stroke-linecap="round"/>
  </svg>`;
  const sprite = new Image();
  sprite.src = 'data:image/svg+xml,' + encodeURIComponent(SVG);

  const cv = document.getElementById('pile'), ctx = cv.getContext('2d');
  const engine = Engine.create({ enableSleeping: true, positionIterations: 12, velocityIterations: 8 });
  Matter.Sleeping._motionSleepThreshold = 0.4;
  const IMPACT_KEEP = 0.2;
  const SQUASH_REF = 15;
  let W, H, belt, wall, chickens = [], acc = 0, beltOffset = 0;

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    if (belt) Composite.remove(engine.world, [belt, wall]);
    const t = 100;
    belt = Bodies.rectangle(W / 2 + 150, H - BELT_H + t / 2, W + 2 * t + 300, t, { isStatic: true });
    wall = Bodies.rectangle(-t / 2, H / 2, t, H * 4, { isStatic: true });
    Composite.add(engine.world, [belt, wall]);
    for (const c of chickens) Matter.Sleeping.set(c, false);
  }
  addEventListener('resize', resize);
  resize();

  function dropChicken() {
    const x = CW / 2 + Math.random() ** SPAWN_SKEW * (W - CW), y = -CW;
    const opts = { friction: 0.9, frictionStatic: 1, restitution: 0, slop: 0.02 };
    const meat = { ...opts, density: 0.0035 }, bone = { ...opts, density: 0.0005 };
    const body = Body.create({
      parts: [
        Bodies.polygon(x - 7.5, y, 7, 11, meat),
        Bodies.rectangle(x + 8, y + 0.5, 22, 5, bone),
        Bodies.polygon(x + 16, y + 0.5, 5, 5, bone),
      ],
      ...opts,
      frictionAir: 0.01,
      sleepThreshold: 30,
    });
    body.squash = 0;
    body.spriteOffset = { x: x - body.position.x, y: y - body.position.y };
    Body.setAngle(body, Math.random() * Math.PI * 2);
    Body.setAngularVelocity(body, (Math.random() - 0.5) * 0.3);
    Composite.add(engine.world, body);
    chickens.push(body);
  }

  Matter.Events.on(engine, 'collisionStart', e => {
    for (const { bodyA, bodyB } of e.pairs) {
      for (const b of [bodyA.parent, bodyB.parent]) {
        if (b.squash === undefined || b.landed) continue;
        b.landed = true;
        b.squash = Math.min(Math.abs(b.velocity.y) / SQUASH_REF, 1) * 0.25;
        Body.setVelocity(b, { x: b.velocity.x * IMPACT_KEEP, y: b.velocity.y * IMPACT_KEEP });
        Body.setAngularVelocity(b, b.angularVelocity * IMPACT_KEEP);
      }
    }
  });

  function conveyor() {
    const dx = BELT_SPEED * STEP / 1000;
    beltOffset = (beltOffset + dx) % 24;
    const resting = new Set();
    for (const pair of engine.pairs.list) {
      if (!pair.isActive) continue;
      resting.add(pair.bodyA.parent).add(pair.bodyB.parent);
    }
    for (const c of chickens) if (c.isSleeping || resting.has(c)) Body.translate(c, { x: dx, y: 0 });
  }

  function drain() {
    chickens = chickens.filter(c => {
      if (c.position.x < W + CW && c.position.y < H + CW) return true;
      Composite.remove(engine.world, c);
      return false;
    });
  }

  function drawBelt() {
    ctx.fillStyle = '#3a3a3a';
    ctx.fillRect(0, H - BELT_H, W, BELT_H);
    ctx.fillStyle = '#5a5a5a';
    for (let x = beltOffset - 24; x < W; x += 24) ctx.fillRect(x, H - BELT_H + 3, 12, BELT_H - 6);
  }

  function step(dtMs) {
    acc += dtMs;
    for (let n = 0; acc >= STEP && n < 4; n++, acc -= STEP) {
      conveyor();
      Engine.update(engine, STEP);
    }
    acc = Math.min(acc, STEP);
    drain();

    ctx.clearRect(0, 0, W, H);
    drawBelt();
    for (const c of chickens) {
      ctx.save();
      ctx.translate(c.position.x, c.position.y);
      ctx.rotate(c.angle);
      if (c.squash > 0.01) {
        ctx.scale(1 + c.squash, 1 - c.squash);
        c.squash *= 0.8;
      }
      ctx.drawImage(sprite, c.spriteOffset.x - CW / 2, c.spriteOffset.y - CH / 2, CW, CH);
      ctx.restore();
    }
  }

  function tick(now) {
    const total = Math.floor((now - start) / 1000 * RATE);

    const newOnes = total - shown;
    for (let i = 0; i < Math.min(newOnes, 10); i++) dropChicken();
    shown = total;
    countEl.textContent = fmt.format(total);

    const midnight = new Date();
    midnight.setHours(0, 0, 0, 0);
    todayEl.textContent = fmt.format(Math.floor((Date.now() - midnight) / 1000 * RATE));

    step(Math.min(now - last, 100));
    last = now;
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
</script>
</body>
</html>
